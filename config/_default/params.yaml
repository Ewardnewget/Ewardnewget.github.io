# The homepage layout reads data/authors/me.yaml directly.
# These are the HugoBlox defaults used by any future theme-rendered pages.
hugoblox:
  schema: '2.0'
  identity:
    name: 'Shihao Zhu'
    type: person
    description: 'Software analysis and testing; concurrent software security.'
    social:
      twitter: ''
  theme:
    mode: light
    pack: default
    colors:
      primary: '#183e63'
  typography:
    pack: academic
  header:
    enable: true
    style: minimal
    sticky: false
    search: false
    theme_toggle: false
    theme_picker: false
    language_switcher: false
  footer:
    style: minimal
    language_switcher: false
  copyright:
    notice: '© {year} {name}'
  search:
    enable: false
  comments:
    enable: false
  content:
    math:
      enable: false
    reading_time:
      enable: false
  repository:
    enable: false
    url: 'https://github.com/Ewardnewget/Ewardnewget.github.io'
    branch: main
    content_dir: site-content
  pro:
    hide_attribution: false
