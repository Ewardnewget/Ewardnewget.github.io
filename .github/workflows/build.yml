name: Build and validate homepage

on:
  pull_request:
    branches: ['main']
  workflow_call:
    inputs:
      base-url:
        description: Site URL supplied by GitHub Pages
        required: false
        type: string
        default: 'https://ewardnewget.github.io/'
    outputs:
      artifact-id:
        description: Built Pages artifact
        value: ${{ jobs.build.outputs.artifact-id }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
      - name: Validate editable content
        run: .venv/bin/python -m unittest discover -s tests -p test_content.py -v
      - name: Read pinned Hugo version
        id: hugo-version
        run: |
          VERSION=$(.venv/bin/python -c 'import yaml; print(yaml.safe_load(open("hugoblox.yaml"))["build"]["hugo_version"])')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install existing theme dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true
      - name: Check JavaScript syntax
        run: node --check site-static/js/researcher.js
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          SITE_BASE_URL: ${{ inputs.base-url || 'https://ewardnewget.github.io/' }}
        run: hugo --minify --destination public --baseURL "$SITE_BASE_URL"
      - name: Validate generated HTML and local links
        env:
          SITE_BASE_URL: ${{ inputs.base-url || 'https://ewardnewget.github.io/' }}
        run: |
          .venv/bin/python scripts/check_site.py public --base-url "$SITE_BASE_URL"
          .venv/bin/python -m unittest discover -s tests -p test_site.py -v
      - name: Upload PR preview (not a deployment)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: researcher-site-preview
          path: public/
          retention-days: 14
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/
